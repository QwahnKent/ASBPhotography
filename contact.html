<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | ASB Photography</title>
  <meta name="description" content="Book a photo shoot with ASB Photography.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kotta+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">
  <header class="site-header">
    <a class="logo" href="index.html">ASB Photography</a>
    <nav aria-label="Main">
      <a href="about.html">About</a>
      <a href="portfolio.html">Portfolio</a>
    </nav>
  </header>
  <main>
    <h1 class="page-title">Contact Me!</h1>
    <!--
      Messages are delivered by FormSubmit (free). To change where they go,
      replace YOUR-EMAIL@example.com below with her email address.
    -->
    <form id="contact-form" class="contact-form" action="https://formsubmit.co/asavagebrooks@gmail.com" method="POST">
      <input type="hidden" name="_subject" value="Photo Shoot Inquiry!">
      <input type="hidden" name="_template" value="table">
      <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">

      <div class="field">
        <label for="first-name">First Name</label>
        <input id="first-name" name="First Name" type="text" autocomplete="given-name" required>
      </div>
      <div class="field">
        <label for="last-name">Last Name</label>
        <input id="last-name" name="Last Name" type="text" autocomplete="family-name" required>
      </div>
      <div class="field">
        <label for="phone">Phone Number</label>
        <input id="phone" name="Phone Number" type="tel" autocomplete="tel">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="Message" required></textarea>
      </div>
      <div class="form-actions">
        <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
        <button class="submit" type="submit">Submit</button>
      </div>
    </form>
  </main>
</div>
  <script src="js/main.js"></script>
</body>
</html>
